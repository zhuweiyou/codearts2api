<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>codearts2api</title>
    <!--
    样式拆成独立文件而不是内联 <style>：本页由服务端配了 CSP
    （见 src/server.js 的 SECURITY_HEADERS），内联样式会被拦。
    上游页面自己的样式由它在运行时 installJetHubStyles() 注入 <style> 标签。
  -->
    <link rel="stylesheet" href="/admin.css" />
    <script src="/admin-shell.js"></script>
  </head>
  <body>
    <div class="c2-app">
      <header class="c2-topbar">
        <div class="c2-topbarInner">
          <a class="c2-brand" href="#overview" aria-label="codearts2api 总览">
            <span class="c2-brandMark" aria-hidden="true"></span>
            <span class="c2-brandText">codearts2api</span>
          </a>
          <nav class="c2-nav" id="c2-nav" role="tablist" aria-label="主导航"></nav>
          <div class="c2-actions" id="c2-actions">
            <button
              type="button"
              class="c2-btn c2-iconBtn"
              id="c2-theme"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-label="切换主题"
            >
              ◐
            </button>
            <a class="c2-btn c2-btn--ghost" id="c2-logout" href="/admin/logout" title="退出管理后台">退出</a>
          </div>
        </div>
      </header>
      <main class="c2-main">
        <section
          class="c2-view"
          id="c2-view-overview"
          data-view="overview"
          role="tabpanel"
          aria-label="总览"
          hidden
        ></section>
        <div class="c2-view" id="admin-root" data-view="channels" role="tabpanel" aria-label="渠道管理" hidden>
          <div class="boot">正在加载管理界面…</div>
        </div>
        <section
          class="c2-view"
          id="c2-view-callers"
          data-view="callers"
          role="tabpanel"
          aria-label="调用方"
          hidden
        ></section>
      </main>
    </div>

    <!--
    ⚠️⚠️ 三个 script 必须留在 **<body> 末尾**（而不是 <head> 里）。

    这是踩过的真实故障：为了「样式与脚本都不内联」，一度把它们挪进了 <head>。
    结果 `<head>` 里的普通 <script> 在**解析到那一行时立即执行**，而此刻
    `<body>` 还没被解析 ⇒ `document.getElementById('admin-root')` 返回 null
    ⇒ `createRoot(null)` 之后写 `root.innerHTML` 抛
    `Cannot set properties of null (setting 'innerHTML')`，页面永远停在
    「正在加载管理界面…」。

    修法不是加 `defer`（那会改变三者的执行时机语义），而是**让它们留在
    body 末尾** —— 位置本身就保证了「DOM 已就绪」。

    装载顺序同样是**硬约束**，不能换：

    1. `admin-boot.js` 先定义 `__ModuleLoader__.load` —— 上游 bundle 的第一句
       就会调用它，缺了直接抛 `Cannot read properties of undefined`。
    2. 再加载上游 bundle（把它的 `{ id, factory }` 行截留下来，**不执行** factory）。
    3. 最后由 `admin.js` 调 factory 并渲染。

    拆成外部文件是为了让 `script-src 'self'` 这条 CSP 成立 —— 内联 <script>
    只有两个下场：要么放行 'unsafe-inline'（CSP 基本作废），要么给这个静态
    文件插 nonce（把它变成模板）。见 public/admin-boot.js 的文件头。
  -->
    <script src="/admin-boot.js"></script>
    <script src="/upstream-jet-hub.js"></script>
    <script src="/admin.js"></script>
    <script src="/admin/dashboard-ui.js"></script>
    <!-- dashboard-admin-entry -->
    <script src="/admin/callers-ui.js"></script>
    <!-- callers-ui-entry -->
    <script src="/admin/models-ui.js"></script>
    <!-- models-admin-entry -->
    <script src="/admin/oauth-relay-ui.js"></script>
    <!-- oauth-relay-entry -->
  </body>
</html>
