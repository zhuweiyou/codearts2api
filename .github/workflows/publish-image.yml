name: Publish image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to build
        default: ""
        type: string
      publish_latest:
        description: Publish the selected commit as latest
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 先跑测试门禁（格式/lint/类型/测试）；通过后 build 才构建镜像 ──
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
      PNPM_CONFIG_STORE_DIR: /home/runner/pnpm-store
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format & lint (vp check)
        run: pnpm exec vp check
      - name: Type check (web)
        run: pnpm run typecheck
      # 后端测试会访问 /admin（serveFrontend 需 dist/index.html，否则 503），先构建前端
      - name: Build frontend (for /admin SPA tests)
        run: pnpm run build:web
      - name: Unit / UI tests (vp test)
        run: pnpm exec vp test run

  # ── 每个架构在自己的原生硬件上并行构建 ──
  # 不用 QEMU 跨架构模拟：amd64 跑在 ubuntu-24.04，arm64 跑在 ubuntu-24.04-arm
  # （GitHub 官方 ARM64 托管 runner）。原生构建比 QEMU 快得多，也避免模拟环境下
  # 原生二进制（如 sharp）行为异常。
  #
  # 两个架构都「按 digest 推送」（push-by-digest）：各自只把一个平台镜像推到
  # GHCR，并把得到的 sha256 digest 作为 artifact 传出去，由下面的 merge job
  # 汇总成一个多架构 manifest list。这样最终 tag 才会同时指向 amd64 与 arm64。
  build:
    needs: test
    if: >-
      github.event_name != 'push' || github.ref_type == 'tag' ||
      github.ref_name == github.event.repository.default_branch || inputs.ref != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    # 把实际检出的 commit 传给 merge job —— workflow_call 时 github.sha 是「调用方」
    # 的 SHA，未必等于 inputs.ref 指定的升级提交，故必须由 checkout 后的 git 结果为准。
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Read source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 原生 runner 不需要 QEMU；buildx 只用来支持 push-by-digest 与 imagetools。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ inputs.publish_latest || (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.source.outputs.sha }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # PR：load 到本地用于冒烟、不推送；默认分支/tag：按 digest 推送。
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && steps.meta.outputs.tags || '' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test image (/healthz)
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          else
            IMAGE="$IMG@${{ steps.build.outputs.digest }}"
            docker pull "$IMAGE"
          fi
          echo "Smoke image: $IMAGE"
          docker run -d --name "smoke-${{ matrix.arch }}" \
            -e CODEARTS2API_ADMIN_AUTH=0 -e DSH_OPENAI_GATEWAY_ENABLED=0 \
            -p 18080:8080 "$IMAGE"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz > /tmp/hz 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs "smoke-${{ matrix.arch }}" || true
          docker rm -f "smoke-${{ matrix.arch }}" || true
          if [ "$ok" != "1" ]; then echo "::error::/healthz smoke failed"; exit 1; fi
          echo "healthz OK: $(cat /tmp/hz)"

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 合并清单：把两个平台镜像拼成一个多架构 manifest list ──
  # 这一步只操作 registry 上的 digest（imagetools create），不做任何重新构建，
  # 因此只需一个普通 runner。
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ inputs.publish_latest || (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ needs.build.outputs.sha }}
            type=ref,event=pr

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
