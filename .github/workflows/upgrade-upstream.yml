name: 升级上游依赖

# ── 触发时机 ──
#
# ① 每天北京时间 08:08 定时跑一次。
#    ⚠️ GitHub Actions 的 cron 用 **UTC**，且**按小时错开**（防止全平台同一时刻打爆）。
#    08:08 北京时间 = 00:08 UTC，所以这里写 `8 0 * * *`。
#    （不是 `0 8`——那是 UTC 8 点 = 北京时间 16 点。）
# ② 可在 Actions 页手动触发（workflow_dispatch）。
on:
  schedule:
    - cron: "8 0 * * *"
  workflow_dispatch:

# 允许推送到仓库（脚本会自动 commit）
permissions:
  contents: write

# 同一时间只跑一个（手动触发时若定时任务正在跑，排队而不是并发）
concurrency:
  group: upgrade-upstream
  cancel-in-progress: false

jobs:
  upgrade:
    # ⚠️ **显式钉 `ubuntu-24.04`，不用 `ubuntu-latest`**：
    #    `ubuntu-latest` 正在迁移到 Ubuntu 26（GitHub 会在 Actions 里持续提示），
    #    而且 `latest` 指向会随时间漂移 —— 哪天 runner 换了默认 Node 版本，
    #    构建就会莫名其妙地挂掉。钉死具体版本才有可复现性。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      changed: ${{ steps.push.outputs.changed }}

    # ⚠️ **job 级**设置（不是 step 级）：pnpm 11 的「新包冷却期」默认拒绝装发布不足
    #    24 小时的包，而上游会把它刚发布的 DSH 基础包写进自己的 lockfile ⇒
    #    上游 prepare 阶段失败（`The lockfile contains entries that the active
    #    policies reject …`）。上游每次发版后约 24 小时内都会这样。
    #
    #    必须是 **job 级**：脚本内部也会调 `pnpm install`（升级时重装依赖），
    #    step 级的 env 传不进去。只有这个**环境变量**能穿透到 npm 拉起的 pnpm
    #    子进程（`.npmrc` 与 `npm_config_*` 均无效）。
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

    steps:
      - name: 检出代码
        # ⚠️ **v7**：v5 起改用 Node 24 runtime，v4 还挂在已被弃用的 Node 20 上，
        #    runner 会持续刷 deprecation 警告（不会失败，但很吵）。
        uses: actions/checkout@v7
        with:
          # 需要能推回 main
          ref: ${{ github.ref_name }}
          # 把 GITHUB_TOKEN 写进本地 git 配置，后面 `git push` 直接可用。
          # （这是 checkout 的默认行为，这里写出来是为了让人一眼看到推送凭据从哪来。）
          persist-credentials: true

      - name: 安装 pnpm
        # 上游的 `prepare` 脚本要跑 `pnpm build:all`，没有 pnpm 会装不上。
        #
        # ⚠️ **v6**：同样已切到 Node 24 runtime。v6 支持 pnpm v12，但仍可用 `version`
        #    显式钉版本 —— 这里仍钉 11，与 Dockerfile 里一致，保证两条路径装到同一个 pnpm。
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 安装依赖
        # `PNPM_CONFIG_MINIMUM_RELEASE_AGE=0` 在上面的 **job 级 env** 里设置
        # （它也要覆盖脚本内部的那次 `pnpm install`，所以不能只设在本步）。
        # ⚠️ 用 pnpm 安装：上游 git 依赖自带 pnpm-lock，pnpm 会遵循它装对基础包版本；
        #    npm 不读上游 lock，会解析到最新版导致上游 prepare 的 tsc 失败。
        run: pnpm install --frozen-lockfile

      - name: 运行上游升级脚本
        id: upgrade
        # ⚠️ 脚本失败会**非零退出** ⇒ 这一步红 ⇒ workflow 失败 ⇒ 触发失败通知（邮件）。
        #    **不要**写 `|| true`，否则失败会被吞掉，你收不到邮件。
        run: node scripts/upgrade-upstream.mjs

      - name: 推送改动
        id: push
        # ⚠️ **判据是「本地 HEAD 是否领先远程」，不是「工作区有没有改动」。**
        #
        #    脚本是**先 commit 再让这里推**的，所以推送时工作区是干净的 ——
        #    `git diff`（工作区 vs 暂存区）与 `git diff --cached`（暂存区 vs HEAD）
        #    **都是空的**，于是早期版本误判成「没有改动」而跳过推送，
        #    结果就是升级 commit 永远推不上去。
        #
        #    正确的判据：本地分支比远程多出的 commit 数（`git rev-list`）。
        #    为 0 说明上游没更新（脚本直接跳过了），跳过推送；
        #    大于 0 说明有升级 commit，推上去。
        run: |
          # ⚠️ 先 fetch：脚本是在本地 commit 的，远程 ref 可能还是旧的。
          #    `|| true` 是刻意的 —— 没有远程 ref 时 `git fetch` 会报错，
          #    但下面还有一道「HEAD 是否领先」的校验兜底。
          git fetch origin "${{ github.ref_name }}" || true
          # ⚠️ **不能用 `|| echo 0` 兜底**：那会在 fetch 真失败时把 AHEAD 变成 0，
          #    于是「推不上去」被静默吞掉 —— 这正是这个步骤最初踩的坑。
          #    拿不到基准就**直接失败**，让工作流变红、通知发出去。
          if ! git rev-parse --verify "origin/${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::error::拿不到 origin/${{ github.ref_name }}，无法判断是否有新 commit"
            exit 1
          fi
          AHEAD=$(git rev-list --count "origin/${{ github.ref_name }}..HEAD")
          if [ "$AHEAD" -eq 0 ]; then
            echo "上游没有更新（本地无新 commit），无需推送。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "本地领先远程 $AHEAD 个 commit，推送中…"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 汇总失败原因
        # 失败时把要点写进 Actions 的 Summary 页面，邮件里也能看到摘要。
        if: failure()
        run: |
          {
            echo "## ❌ 上游升级失败"
            echo ""
            echo "请到 Actions 日志里看具体报错。常见原因："
            echo ""
            echo "- 上游改了端点路径 / 装配方式（契约漂移）→ 看 \`src/upstream.js\` 顶部契约表"
            echo "- 上游引入了新的外部依赖 → 在 \`web/admin.jsx\` 的 \`captured.factory()\` 里补模块"
            echo "- 上游删除了某个渠道 → 更新 \`tests/host.test.mjs\` 的 \`EXPECTED_PROVIDERS\`"
            echo ""
            echo "回滚：\`git revert\` 掉自动升级那个 commit 即可（依赖与产物都在同一个 commit 里）。"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: upgrade
    if: needs.upgrade.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    # GITHUB_TOKEN 推送的提交不会触发 push 工作流，直接调用镜像发布。
    uses: ./.github/workflows/publish-image.yml
    with:
      ref: ${{ needs.upgrade.outputs.ref }}
      publish_latest: ${{ github.ref_name == github.event.repository.default_branch }}
