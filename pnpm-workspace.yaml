# pnpm 工作区配置。
#
# 本项目改用 pnpm 安装，核心原因：上游 `dsh-providers-hub` 是 git 依赖，其自身用
# pnpm-lock.yaml 锁定 `@deepseek-ai/dsh-llm` 等基础包到它编译验证过的版本。
#   - npm 不读上游的 pnpm-lock，会按 package.json 的宽松版本范围解析到 registry 上
#     最新的基础包（例如 0.2.2-rc.2），其失败码枚举已改名，导致上游 `tsc` prepare 失败；
#   - pnpm 在安装 git 依赖时会遵循上游自带的 pnpm-lock，装回 0.2.2-rc.1，编译通过。
packages:
  - "."

# pnpm 11 默认禁止依赖执行构建脚本。这里放行：
#   - dsh-providers-hub：上游 git 依赖，prepare 要跑 tsc 等。git 依赖的 key 只认精确
#     URL（含 commit），升级上游 commit 时由 scripts/upgrade-upstream.mjs 自动改写本行；
#   - esbuild：vite-plus / vitest / @vitejs/plugin-react 的传递依赖，postinstall 要落平台二进制。
allowBuilds:
  'dsh-providers-hub@https://codeload.github.com/iJetLi/dsh-providers-hub/tar.gz/9becd8cc21c1da1eb065c6fc0ff1d6b519e89104': true
  esbuild: true

# Vite+ 官方要求：把 vite 依赖别名到它捆绑的 core（与安装的 vite-plus 版本一致），
# 否则顶层 `vite` 不存在，@vitejs/plugin-react 等 peer 无法解析。
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.6.0

# 关闭 pnpm 11「新包冷却期」：否则 `vp build/check` 触发的 pnpm install 自检会被
# 上游刚发布的基础包（dsh-*）卡住。放到项目配置里，免去每次手动带环境变量。
minimumReleaseAge: 0
